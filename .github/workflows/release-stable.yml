name: 发布正式版本
run-name: ${{ inputs.operation == 'cache-inspect' && '检查生产缓存' || inputs.operation == 'cache-clean' && '清理生产缓存' || inputs.operation == 'images-inspect' && '检查历史镜像' || inputs.operation == 'images-clean' && '清理历史镜像' || '发布正式版本' }} ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 发布正式版本或维护当前生产缓存及历史镜像
        type: choice
        required: true
        default: release
        options:
          - release
          - cache-inspect
          - cache-clean
          - images-inspect
          - images-clean

permissions:
  contents: read
  actions: read

concurrency:
  group: ai-project-os-production
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ (inputs.operation || 'release') == 'release' }}
    name: Verify candidate and create immutable tag
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: write
      actions: read
    outputs:
      RELEASE_VERSION: ${{ steps.context.outputs.release_version }}
      RELEASE_TAG: ${{ steps.context.outputs.release_tag }}
      MIGRATION_COUNT: ${{ steps.context.outputs.migration_count }}
      SOURCE_MIGRATION_COUNT: ${{ steps.context.outputs.source_migration_count }}
      MAIN_CI_RUN_ID: ${{ steps.context.outputs.main_ci_run_id }}
      MAIN_CI_RUN_URL: ${{ steps.context.outputs.main_ci_run_url }}
      MAIN_CI_SOURCE_BASE: ${{ steps.context.outputs.main_ci_source_base }}
      MAIN_CI_ATTESTED_RISK: ${{ steps.context.outputs.main_ci_attested_risk }}
      RELEASE_RISK: ${{ steps.context.outputs.release_risk }}
      RELEASE_DATABASE_REQUIRED: ${{ steps.context.outputs.release_database_required }}
      RELEASE_BROWSER_REQUIRED: ${{ steps.context.outputs.release_browser_required }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Require the manual main-branch candidate
        run: node scripts/production-stable-release.mjs validate-candidate

      - name: Confirm production source and risk tier
        run: node scripts/production-stable-release.mjs verify-source-health

      - name: Reuse successful exact-SHA main CI for the applicable risk tier
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/production-stable-release.mjs wait-main-ci

      - name: Create or reuse the immutable annotated version tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/production-stable-release.mjs ensure-tag

      - name: Export validated release context
        id: context
        run: node scripts/production-stable-release.mjs export-context

  release:
    if: ${{ (inputs.operation || 'release') == 'release' }}
    needs: prepare
    name: Deploy verified images and accept production
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      packages: read
    environment:
      name: production
      url: https://ai-project-os.com
    env:
      PRODUCTION_SSH_HOST: ${{ vars.PRODUCTION_SSH_HOST }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.RELEASE_VERSION }}
      RELEASE_TAG: ${{ needs.prepare.outputs.RELEASE_TAG }}
      MIGRATION_COUNT: ${{ needs.prepare.outputs.MIGRATION_COUNT }}
      SOURCE_MIGRATION_COUNT: ${{ needs.prepare.outputs.SOURCE_MIGRATION_COUNT }}
      MAIN_CI_RUN_ID: ${{ needs.prepare.outputs.MAIN_CI_RUN_ID }}
      MAIN_CI_RUN_URL: ${{ needs.prepare.outputs.MAIN_CI_RUN_URL }}
      MAIN_CI_SOURCE_BASE: ${{ needs.prepare.outputs.MAIN_CI_SOURCE_BASE }}
      MAIN_CI_ATTESTED_RISK: ${{ needs.prepare.outputs.MAIN_CI_ATTESTED_RISK }}
      RELEASE_RISK: ${{ needs.prepare.outputs.RELEASE_RISK }}
      RELEASE_DATABASE_REQUIRED: ${{ needs.prepare.outputs.RELEASE_DATABASE_REQUIRED }}
      RELEASE_BROWSER_REQUIRED: ${{ needs.prepare.outputs.RELEASE_BROWSER_REQUIRED }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Prepare the pinned production SSH identity
        env:
          PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$PRODUCTION_SSH_PRIVATE_KEY"
          test -n "$PRODUCTION_SSH_KNOWN_HOSTS"
          install -d -m 700 "$RUNNER_TEMP/ai-project-os-stable-ssh"
          printf '%s\n' "$PRODUCTION_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ai-project-os-stable-ssh/id_ed25519"
          printf '%s\n' "$PRODUCTION_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/ai-project-os-stable-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ai-project-os-stable-ssh/id_ed25519" "$RUNNER_TEMP/ai-project-os-stable-ssh/known_hosts"
          ssh-keygen -y -f "$RUNNER_TEMP/ai-project-os-stable-ssh/id_ed25519" >/dev/null
          ssh-keygen -F "$PRODUCTION_SSH_HOST" -f "$RUNNER_TEMP/ai-project-os-stable-ssh/known_hosts" >/dev/null

      - name: Refresh fixed server tooling from the verified main CI
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/ai-project-os-stable-ssh/id_ed25519" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ai-project-os-stable-ssh/known_hosts" \
            -o ConnectTimeout=15 "ai-project-os-actions@$PRODUCTION_SSH_HOST" \
            "refresh-stable-tooling $RELEASE_TAG $GITHUB_SHA CONFIRM_STABLE_TOOLING_FROM_CI"

      - name: Require the permanent server tooling before deployment
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/ai-project-os-stable-ssh/id_ed25519" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ai-project-os-stable-ssh/known_hosts" \
            -o ConnectTimeout=15 "ai-project-os-actions@$PRODUCTION_SSH_HOST" \
            "stable-tooling-status" > "$RUNNER_TEMP/stable-tooling.json"

      - name: Verify all permanent tooling hashes and bootstrap ancestry
        run: node scripts/production-stable-release.mjs verify-tooling "$RUNNER_TEMP/stable-tooling.json"

      - name: Recheck main and immutable tag before production deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/production-stable-release.mjs assert-current-target

      - name: Deploy through the permanent restricted server gateway
        env:
          RELEASE_REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node -e 'process.stdout.write(JSON.stringify({token:process.env.RELEASE_REGISTRY_TOKEN,runId:Number(process.env.MAIN_CI_RUN_ID)}))' \
            | \
          ssh -i "$RUNNER_TEMP/ai-project-os-stable-ssh/id_ed25519" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ai-project-os-stable-ssh/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=20 -o ServerAliveCountMax=90 \
            "ai-project-os-actions@$PRODUCTION_SSH_HOST" \
            "deploy-stable $RELEASE_TAG $GITHUB_SHA CONFIRM_STABLE_CI_IMAGES" \
            | tee "$RUNNER_TEMP/stable-deploy.log"

      - name: Verify the exact image deployment and migration receipt
        run: node scripts/production-stable-release.mjs verify-deployment "$RUNNER_TEMP/stable-deploy.log"

      - name: Save the verified production receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-deployment-receipt
          path: ${{ runner.temp }}/stable-deploy.log
          if-no-files-found: error
          retention-days: 30

      - name: Remove the temporary production SSH identity
        if: ${{ always() }}
        run: rm -f -- "$RUNNER_TEMP/ai-project-os-stable-ssh/id_ed25519" "$RUNNER_TEMP/ai-project-os-stable-ssh/known_hosts"

  publish:
    if: ${{ (inputs.operation || 'release') == 'release' }}
    needs: [prepare, release]
    name: Publish accepted GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.RELEASE_VERSION }}
      RELEASE_TAG: ${{ needs.prepare.outputs.RELEASE_TAG }}
      MIGRATION_COUNT: ${{ needs.prepare.outputs.MIGRATION_COUNT }}
      SOURCE_MIGRATION_COUNT: ${{ needs.prepare.outputs.SOURCE_MIGRATION_COUNT }}
      MAIN_CI_RUN_ID: ${{ needs.prepare.outputs.MAIN_CI_RUN_ID }}
      MAIN_CI_RUN_URL: ${{ needs.prepare.outputs.MAIN_CI_RUN_URL }}
      MAIN_CI_SOURCE_BASE: ${{ needs.prepare.outputs.MAIN_CI_SOURCE_BASE }}
      MAIN_CI_ATTESTED_RISK: ${{ needs.prepare.outputs.MAIN_CI_ATTESTED_RISK }}
      RELEASE_RISK: ${{ needs.prepare.outputs.RELEASE_RISK }}
      RELEASE_DATABASE_REQUIRED: ${{ needs.prepare.outputs.RELEASE_DATABASE_REQUIRED }}
      RELEASE_BROWSER_REQUIRED: ${{ needs.prepare.outputs.RELEASE_BROWSER_REQUIRED }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Read this run's successful deployment receipt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: production-deployment-receipt
          path: ${{ runner.temp }}

      - name: Verify public target health and publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/production-stable-release.mjs publish-release "$RUNNER_TEMP/stable-deploy.log"

  cache-maintenance:
    if: ${{ inputs.operation == 'cache-inspect' || inputs.operation == 'cache-clean' || inputs.operation == 'images-inspect' || inputs.operation == 'images-clean' }}
    name: Inspect or clean production cache and images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    environment:
      name: production
      url: https://ai-project-os.com
    env:
      PRODUCTION_SSH_HOST: ${{ vars.PRODUCTION_SSH_HOST }}
      CACHE_MAINTENANCE_OPERATION: ${{ inputs.operation }}
      NODE_OPTIONS: --max-old-space-size=512
    steps:
      - name: Check out exact maintenance candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0

      - name: Validate main maintenance candidate
        run: node scripts/production-stable-release.mjs validate-candidate

      - name: Verify current live source before maintenance
        run: node scripts/production-stable-release.mjs verify-source-health

      - name: Require exact successful main CI before tooling changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/production-stable-release.mjs wait-main-ci

      - name: Freeze current production identity for cache maintenance
        run: node scripts/production-cache-maintenance.mjs prepare

      - name: Prepare the existing pinned production SSH identity
        env:
          PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$PRODUCTION_SSH_PRIVATE_KEY"
          test -n "$PRODUCTION_SSH_KNOWN_HOSTS"
          install -d -m 700 "$RUNNER_TEMP/cache-maintenance-ssh" "$RUNNER_TEMP/cache-maintenance" "$RUNNER_TEMP/image-maintenance"
          printf '%s\n' "$PRODUCTION_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/cache-maintenance-ssh/id_ed25519"
          printf '%s\n' "$PRODUCTION_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/cache-maintenance-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/cache-maintenance-ssh/id_ed25519" "$RUNNER_TEMP/cache-maintenance-ssh/known_hosts"
          ssh-keygen -y -f "$RUNNER_TEMP/cache-maintenance-ssh/id_ed25519" >/dev/null
          ssh-keygen -F "$PRODUCTION_SSH_HOST" -f "$RUNNER_TEMP/cache-maintenance-ssh/known_hosts" >/dev/null

      - name: Refresh verified fixed tooling without deploying the application
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/cache-maintenance-ssh/id_ed25519" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/cache-maintenance-ssh/known_hosts" \
            -o ConnectTimeout=15 "ai-project-os-actions@$PRODUCTION_SSH_HOST" \
            "refresh-stable-tooling $RELEASE_TAG $GITHUB_SHA CONFIRM_STABLE_TOOLING_FROM_CI"
          ssh -i "$RUNNER_TEMP/cache-maintenance-ssh/id_ed25519" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/cache-maintenance-ssh/known_hosts" \
            -o ConnectTimeout=15 "ai-project-os-actions@$PRODUCTION_SSH_HOST" \
            "stable-tooling-status" > "$RUNNER_TEMP/cache-maintenance/tooling.json"
          node scripts/production-stable-release.mjs verify-tooling "$RUNNER_TEMP/cache-maintenance/tooling.json"
          if [[ "$CACHE_MAINTENANCE_OPERATION" == images-* ]]; then
            cp "$RUNNER_TEMP/cache-maintenance/tooling.json" "$RUNNER_TEMP/image-maintenance/tooling.json"
          fi

      - name: Inspect and freeze exact reclaimable cache records
        if: ${{ inputs.operation == 'cache-inspect' || inputs.operation == 'cache-clean' }}
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/cache-maintenance-ssh/id_ed25519" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/cache-maintenance-ssh/known_hosts" \
            -o ConnectTimeout=15 "ai-project-os-actions@$PRODUCTION_SSH_HOST" \
            "inspect-cache $CACHE_CURRENT_TAG $CACHE_CURRENT_REVISION CONFIRM_CACHE_INSPECT" \
            | tee "$RUNNER_TEMP/cache-maintenance/inspect.log"
          node scripts/production-cache-maintenance.mjs parse-inspect \
            "$RUNNER_TEMP/cache-maintenance/inspect.log" "$RUNNER_TEMP/cache-maintenance/inspect.json"

      - name: Clean only the inspected and still-reclaimable record IDs
        if: ${{ inputs.operation == 'cache-clean' }}
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/cache-maintenance-ssh/id_ed25519" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/cache-maintenance-ssh/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=20 -o ServerAliveCountMax=45 \
            "ai-project-os-actions@$PRODUCTION_SSH_HOST" \
            "clean-cache $CACHE_CURRENT_TAG $CACHE_CURRENT_REVISION $CACHE_PLAN_DIGEST" \
            | tee "$RUNNER_TEMP/cache-maintenance/clean.log"
          node scripts/production-cache-maintenance.mjs parse-clean \
            "$RUNNER_TEMP/cache-maintenance/clean.log" "$RUNNER_TEMP/cache-maintenance/clean.json"

      - name: Inspect ownership and references for the fixed historical image IDs
        if: ${{ inputs.operation == 'images-inspect' || inputs.operation == 'images-clean' }}
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/cache-maintenance-ssh/id_ed25519" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/cache-maintenance-ssh/known_hosts" \
            -o ConnectTimeout=15 "ai-project-os-actions@$PRODUCTION_SSH_HOST" \
            "inspect-images $CACHE_CURRENT_TAG $CACHE_CURRENT_REVISION CONFIRM_IMAGE_INSPECT" \
            | tee "$RUNNER_TEMP/image-maintenance/inspect.log"
          node scripts/production-cache-maintenance.mjs parse-image-inspect \
            "$RUNNER_TEMP/image-maintenance/inspect.log" "$RUNNER_TEMP/image-maintenance/inspect.json"

      - name: Clean confirmed old unreferenced images by immutable ID
        if: ${{ inputs.operation == 'images-clean' }}
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/cache-maintenance-ssh/id_ed25519" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/cache-maintenance-ssh/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=20 -o ServerAliveCountMax=45 \
            "ai-project-os-actions@$PRODUCTION_SSH_HOST" \
            "clean-images $CACHE_CURRENT_TAG $CACHE_CURRENT_REVISION $IMAGE_PLAN_DIGEST" \
            | tee "$RUNNER_TEMP/image-maintenance/clean.log"
          node scripts/production-cache-maintenance.mjs parse-image-clean \
            "$RUNNER_TEMP/image-maintenance/clean.log" "$RUNNER_TEMP/image-maintenance/clean.json" \
            "$RUNNER_TEMP/image-maintenance/inspect.json"

      - name: Verify unchanged public application health
        if: ${{ inputs.operation == 'cache-inspect' || inputs.operation == 'cache-clean' }}
        run: node scripts/production-cache-maintenance.mjs health "$RUNNER_TEMP/cache-maintenance/public-health.json"

      - name: Verify unchanged public application health after image maintenance
        if: ${{ inputs.operation == 'images-inspect' || inputs.operation == 'images-clean' }}
        run: node scripts/production-cache-maintenance.mjs health "$RUNNER_TEMP/image-maintenance/public-health.json"

      - name: Save cache classifications and maintenance evidence
        if: ${{ always() && (inputs.operation == 'cache-inspect' || inputs.operation == 'cache-clean') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: production-cache-maintenance
          path: ${{ runner.temp }}/cache-maintenance/
          if-no-files-found: ignore
          retention-days: 30

      - name: Save historical image ownership and cleanup evidence
        if: ${{ always() && (inputs.operation == 'images-inspect' || inputs.operation == 'images-clean') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: production-image-maintenance
          path: ${{ runner.temp }}/image-maintenance/
          if-no-files-found: ignore
          retention-days: 30

      - name: Remove the temporary maintenance SSH identity
        if: ${{ always() }}
        run: rm -f -- "$RUNNER_TEMP/cache-maintenance-ssh/id_ed25519" "$RUNNER_TEMP/cache-maintenance-ssh/known_hosts"
