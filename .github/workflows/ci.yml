name: CI
run-name: CI ${{ github.ref_name }} @ ${{ github.sha }}

on:
  push:
  pull_request:
permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      risk: ${{ steps.classify.outputs.risk }}
      base: ${{ steps.classify.outputs.base }}
      database: ${{ steps.classify.outputs.database }}
      browser: ${{ steps.classify.outputs.browser }}
      coverage: ${{ steps.classify.outputs.coverage }}
      impact_gate_filter: ${{ steps.classify.outputs.impact_gate_filter }}
      impact_phone_auth: ${{ steps.classify.outputs.impact_phone_auth }}
      impact_oid10: ${{ steps.classify.outputs.impact_oid10 }}
      impact_browser: ${{ steps.classify.outputs.impact_browser }}
      impact_candidate: ${{ steps.classify.outputs.impact_candidate }}
      impact_schema_validation: ${{ steps.classify.outputs.impact_schema_validation }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify actual Workflow credential transport before building
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Jack-Kunlun/ai-project-os' }}
        env:
          RELEASE_REGISTRY_TOKEN: ${{ github.token }}
          MAIN_CI_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          node -e 'process.stdout.write(JSON.stringify({token:process.env.RELEASE_REGISTRY_TOKEN,runId:Number(process.env.MAIN_CI_RUN_ID)}))' \
            | python3 -I -B scripts/production-stable-credentials.py

      - name: Classify cumulative production and test impact
        id: classify
        env:
          CI_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            printf 'risk=tag\nbase=unknown\ndatabase=false\nbrowser=false\ncoverage=false\nimpact_gate_filter=none\nimpact_phone_auth=false\nimpact_oid10=false\nimpact_browser=false\nimpact_candidate=false\nimpact_schema_validation=false\n' >> "$GITHUB_OUTPUT"
          else
            node scripts/ci-change-scope.mjs
          fi

  source:
    needs: scope
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    name: Verify source and client
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      plan_fingerprint: ${{ steps.test_plan.outputs.plan_fingerprint }}
      browser_mode: ${{ steps.test_plan.outputs.browser_mode }}
      unit_mode: ${{ steps.test_plan.outputs.unit_mode }}
      unit_receipt_fingerprint: ${{ steps.unit_checks.outputs.receipt_fingerprint }}
    env:
      DATABASE_URL: postgresql://ci_static:ci_static@127.0.0.1:1/ci_static
      NEXT_TELEMETRY_DISABLED: "1"
      CI_TEST_BASE: ${{ needs.scope.outputs.base }}
      CI_TEST_TARGET: ${{ github.sha }}
      CI_TEST_RISK: ${{ needs.scope.outputs.risk }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack install --global pnpm@10.14.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Plan affected checks from the cumulative production diff
        id: test_plan
        run: node scripts/ci-test-checks.mjs plan "$RUNNER_TEMP/ci-test-plan.json"

      - name: Generate Prisma client for TypeScript checks
        run: pnpm db:generate

      - name: Run static checks
        run: |
          pnpm lint
          NODE_OPTIONS=--max-old-space-size=6144 pnpm typecheck

      - name: Run the applicable unit checks and record their exact plan
        id: unit_checks
        run: node scripts/ci-test-checks.mjs unit "$RUNNER_TEMP/ci-test-plan.json" "$RUNNER_TEMP/ci-unit-receipt.json"

      - name: Save the source test plan and execution receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-source-checks
          path: |
            ${{ runner.temp }}/ci-test-plan.json
            ${{ runner.temp }}/ci-unit-receipt.json
          if-no-files-found: ignore
          retention-days: 30

  database:
    needs: scope
    if: ${{ !startsWith(github.ref, 'refs/tags/') && needs.scope.outputs.risk == 'high' }}
    name: Verify database and release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-trixie@sha256:78bf48b801e792f99e3ac62b5036fd3876e9be48afda16c1e331af1c75ceb2ff
        env:
          POSTGRES_USER: ai_project_os_ci_cluster_admin
          POSTGRES_PASSWORD: AiProjectOsCiAdmin_20260831
          POSTGRES_DB: postgres
        ports:
          - 56432:5432
        options: >-
          --health-cmd "pg_isready -U ai_project_os_ci_cluster_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://ai_project_os_gate:AiProjectOsCiGate_20260831@127.0.0.1:56432/ai_project_os_ci_default_test
      POSTGRES_GATE_ADMIN_URL: postgresql://ai_project_os_ci_cluster_admin:AiProjectOsCiAdmin_20260831@127.0.0.1:56432/postgres
      POSTGRES_GATE_TEST_PASSWORD: AiProjectOsCiGate_20260831
      POSTGRES_GATE_FILTER: ${{ needs.scope.outputs.impact_gate_filter }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack install --global pnpm@10.14.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Validate Prisma schema and migrations when changed
        if: ${{ needs.scope.outputs.impact_schema_validation == 'true' }}
        run: pnpm db:validate

      - name: Run selected PostgreSQL gates
        run: pnpm test:postgres-gates

      - name: Run phone authentication gate when affected
        if: ${{ needs.scope.outputs.impact_phone_auth == 'true' }}
        run: pnpm test:phone-auth-postgres

      - name: Run PostgreSQL 18 OID10 gate when affected
        if: ${{ needs.scope.outputs.impact_oid10 == 'true' }}
        run: pnpm test:database-principal-oid10

  build-images:
    needs: scope
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    name: Build and verify release images
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      plan_fingerprint: ${{ steps.test_plan.outputs.plan_fingerprint }}
      browser_mode: ${{ steps.test_plan.outputs.browser_mode }}
      browser_receipt_fingerprint: ${{ steps.browser_checks.outputs.receipt_fingerprint || steps.browser_none.outputs.receipt_fingerprint }}
    permissions:
      actions: read
      contents: read
      packages: write
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-trixie@sha256:78bf48b801e792f99e3ac62b5036fd3876e9be48afda16c1e331af1c75ceb2ff
        env:
          POSTGRES_USER: ai_project_os_ci_cluster_admin
          POSTGRES_PASSWORD: AiProjectOsCiAdmin_20260831
          POSTGRES_DB: postgres
        ports:
          - 56432:5432
        options: >-
          --health-cmd "pg_isready -U ai_project_os_ci_cluster_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://ci_static:ci_static@127.0.0.1:1/ci_static
      POSTGRES_GATE_ADMIN_URL: postgresql://ai_project_os_ci_cluster_admin:AiProjectOsCiAdmin_20260831@127.0.0.1:56432/postgres
      POSTGRES_GATE_TEST_PASSWORD: AiProjectOsCiGate_20260831
      NEXT_TELEMETRY_DISABLED: "1"
      CI_TEST_BASE: ${{ needs.scope.outputs.base }}
      CI_TEST_TARGET: ${{ github.sha }}
      CI_TEST_RISK: ${{ needs.scope.outputs.risk }}
      CI_TEST_PLAN: ${{ runner.temp }}/ci-test-plan.json
      CI_TEST_RECEIPT: ${{ runner.temp }}/ci-browser-receipt.json
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack install --global pnpm@10.14.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Plan affected checks from the cumulative production diff
        id: test_plan
        run: node scripts/ci-test-checks.mjs plan "$CI_TEST_PLAN"

      - name: Generate Prisma client for runner-side release checks
        run: pnpm db:generate

      - name: Set up shared BuildKit builder
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        with:
          driver: docker-container

      - name: Resolve release identity
        id: identity
        run: |
          version="$(node -p 'require("./package.json").version')"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Build app, worker, and migration images once
        env:
          APP_VERSION: ${{ steps.identity.outputs.version }}
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          source: .
          files: docker-bake.hcl
          targets: app,worker,migrate
          load: true
          vars: |
            APP_VERSION=${{ steps.identity.outputs.version }}
            APP_REVISION=${{ github.sha }}
          set: |
            *.cache-from=type=gha,scope=release-images
            *.cache-to=type=gha,scope=release-images,mode=max,ignore-error=true

      - name: Verify immutable IDs for the built images
        env:
          APP_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/prepare-release-images.mjs "$RUNNER_TEMP/release-images.local.json"
          printf 'RELEASE_IMAGES_MANIFEST=%s/release-images.local.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Export the already-built Next.js output for performance checks
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          source: .
          files: docker-bake.hcl
          targets: performance-export
          vars: |
            APP_VERSION=${{ steps.identity.outputs.version }}
            APP_REVISION=${{ github.sha }}
          set: |
            performance-export.cache-from=type=gha,scope=release-images
            performance-export.output=type=local,dest=${{ runner.temp }}/ci-performance

      - name: Check performance budget from the exported build output
        run: |
          set -euo pipefail
          cp -a "$RUNNER_TEMP/ci-performance/.next" .next
          pnpm performance:check

      - name: Install Chromium for affected browser checks
        if: ${{ steps.test_plan.outputs.browser_mode != 'none' }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Run production browser and accessibility checks on the built images
        id: browser_checks
        if: ${{ steps.test_plan.outputs.browser_mode != 'none' }}
        run: NODE_OPTIONS=--max-old-space-size=6144 pnpm test:browser-e2e

      - name: Record that the cumulative diff requires no browser checks
        id: browser_none
        if: ${{ steps.test_plan.outputs.browser_mode == 'none' }}
        run: node scripts/ci-test-checks.mjs browser-none "$CI_TEST_PLAN" "$CI_TEST_RECEIPT"

      - name: Save the browser plan and discovery execution receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-browser-checks
          path: |
            ${{ runner.temp }}/ci-test-plan.json
            ${{ runner.temp }}/ci-browser-receipt.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Run isolated release candidate with the same image IDs
        if: ${{ needs.scope.outputs.impact_candidate == 'true' }}
        run: pnpm release:local

      - name: Publish immutable images for manual release workflow
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_USERNAME: ${{ github.actor }}
        run: |
          set -euo pipefail
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          APP_VERSION="${{ steps.identity.outputs.version }}"
          export APP_VERSION
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GH_USERNAME" --password-stdin
          node --import tsx scripts/publish-release-images.mjs \
            "$RUNNER_TEMP/release-images.local.json" \
            "$RUNNER_TEMP/release-images.json"
          python3 -I -B scripts/production-stable-image-roundtrip.py \
            "$RUNNER_TEMP/release-images.local.json" \
            "$RUNNER_TEMP/release-images.json"

      - name: Upload immutable release image manifest
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-images
          path: ${{ runner.temp }}/release-images.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload browser diagnostics
        if: ${{ always() && steps.test_plan.outputs.browser_mode != 'none' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-diagnostics
          path: |
            playwright-report
            test-results/playwright
          if-no-files-found: ignore
          retention-days: 14

  verify:
    needs: [scope, source, database, build-images]
    if: ${{ always() && !startsWith(github.ref, 'refs/tags/') }}
    name: Verify internal delivery gates [risk=${{ needs.scope.outputs.risk }} base=${{ needs.scope.outputs.base }}]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every applicable gate and the exact-sha image job
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          SOURCE_RESULT: ${{ needs.source.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
          IMAGE_RESULT: ${{ needs.build-images.result }}
          RISK: ${{ needs.scope.outputs.risk }}
          BASE: ${{ needs.scope.outputs.base }}
          DATABASE_REQUIRED: ${{ needs.scope.outputs.risk == 'high' }}
          SOURCE_PLAN_FINGERPRINT: ${{ needs.source.outputs.plan_fingerprint }}
          IMAGE_PLAN_FINGERPRINT: ${{ needs.build-images.outputs.plan_fingerprint }}
          SOURCE_BROWSER_MODE: ${{ needs.source.outputs.browser_mode }}
          IMAGE_BROWSER_MODE: ${{ needs.build-images.outputs.browser_mode }}
          UNIT_MODE: ${{ needs.source.outputs.unit_mode }}
          UNIT_RECEIPT_FINGERPRINT: ${{ needs.source.outputs.unit_receipt_fingerprint }}
          BROWSER_RECEIPT_FINGERPRINT: ${{ needs.build-images.outputs.browser_receipt_fingerprint }}
        run: |
          set -euo pipefail
          test "$SCOPE_RESULT" = success
          test "$SOURCE_RESULT" = success
          test "$IMAGE_RESULT" = success
          [[ "$SOURCE_PLAN_FINGERPRINT" =~ ^[a-f0-9]{64}$ ]] || exit 1
          test "$SOURCE_PLAN_FINGERPRINT" = "$IMAGE_PLAN_FINGERPRINT"
          test "$SOURCE_BROWSER_MODE" = "$IMAGE_BROWSER_MODE"
          case "$SOURCE_BROWSER_MODE" in none|selected|full) ;; *) exit 1 ;; esac
          case "$UNIT_MODE" in none|selected|full) ;; *) exit 1 ;; esac
          [[ "$UNIT_RECEIPT_FINGERPRINT" =~ ^[a-f0-9]{64}$ ]] || exit 1
          [[ "$BROWSER_RECEIPT_FINGERPRINT" =~ ^[a-f0-9]{64}$ ]] || exit 1
          case "$RISK" in low|medium|high) ;; *) exit 1 ;; esac
          if [[ "$BASE" != unknown ]]; then
            [[ "$BASE" =~ ^[a-f0-9]{40}$ ]] || exit 1
          else
            test "$RISK" = high
          fi
          if [[ "$DATABASE_REQUIRED" == true ]]; then
            test "$DATABASE_RESULT" = success
          else
            test "$DATABASE_RESULT" = skipped
          fi

  tag-attestation:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    name: Attest tag ${{ github.ref_name }} at ${{ github.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out annotated tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require an applicable successful main CI proof for the exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/production-stable-release.mjs attest-tag
