name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify internal delivery gates
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-trixie@sha256:78bf48b801e792f99e3ac62b5036fd3876e9be48afda16c1e331af1c75ceb2ff
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: AiProjectOsCiAdmin_20260831
          POSTGRES_DB: postgres
        ports:
          - 56432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://ai_project_os_gate:AiProjectOsCiGate_20260831@127.0.0.1:56432/ai_project_os_ci_default_test
      POSTGRES_GATE_ADMIN_URL: postgresql://postgres:AiProjectOsCiAdmin_20260831@127.0.0.1:56432/postgres
      POSTGRES_GATE_TEST_PASSWORD: AiProjectOsCiGate_20260831
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack install --global pnpm@10.14.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma and migrations
        run: |
          pnpm db:generate
          pnpm db:validate

      - name: Run static checks
        run: |
          pnpm lint
          pnpm typecheck

      - name: Run default test suite with coverage thresholds
        run: pnpm test:coverage

      - name: Run every PostgreSQL gate
        run: pnpm test:postgres-gates

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run production browser and accessibility gates
        run: pnpm test:browser-e2e

      - name: Enforce production client performance budgets
        run: pnpm performance:check

      - name: Build, restart, and clean isolated release candidate
        run: pnpm release:local

      - name: Upload browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-diagnostics
          path: |
            playwright-report
            test-results/playwright
          if-no-files-found: ignore
          retention-days: 14
