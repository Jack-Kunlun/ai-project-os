services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie@sha256:78bf48b801e792f99e3ac62b5036fd3876e9be48afda16c1e331af1c75ceb2ff
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_project_os}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ai_project_os}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ai_project_os_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: .
      target: migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-ai_project_os}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_project_os}"
    restart: "no"

  app:
    build:
      context: .
      target: runner
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://${POSTGRES_USER:-ai_project_os}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_project_os}"
      AI_PROJECT_OS_MASTER_KEY_FILE: /var/lib/ai-project-os-secrets/master.key
      AI_PROJECT_OS_WORKER_NAME: ${AI_PROJECT_OS_WORKER_NAME:-automation-primary}
    volumes:
      - ai_project_os_secrets:/var/lib/ai-project-os-secrets
      - ai_project_os_uploads:/var/lib/ai-project-os/uploads
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/api/health').then(async (response) => {
          const body = await response.json();
          if (!response.ok || body.status !== 'ok' || body.database !== 'up') process.exit(1);
          }).catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  worker:
    build:
      context: .
      target: worker
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://${POSTGRES_USER:-ai_project_os}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_project_os}"
      AI_PROJECT_OS_MASTER_KEY_FILE: /var/lib/ai-project-os-secrets/master.key
      AI_PROJECT_OS_WORKER_NAME: ${AI_PROJECT_OS_WORKER_NAME:-automation-primary}
    volumes:
      - ai_project_os_secrets:/var/lib/ai-project-os-secrets
      - ai_project_os_uploads:/var/lib/ai-project-os/uploads
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "node", "node_modules/tsx/dist/cli.mjs", "scripts/worker-healthcheck.ts"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

volumes:
  ai_project_os_pgdata:
    name: ${AI_PROJECT_OS_PGDATA_VOLUME:-ai-project-os-pgdata}
  ai_project_os_secrets:
    name: ${AI_PROJECT_OS_SECRETS_VOLUME:-ai-project-os-secrets}
  ai_project_os_uploads:
    name: ${AI_PROJECT_OS_UPLOADS_VOLUME:-ai-project-os-uploads}
