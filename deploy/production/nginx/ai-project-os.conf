# Nginx terminates public TLS directly, so this keys limits to the peer address
# and never trusts a client-supplied forwarded-address header.
limit_req_zone $binary_remote_addr zone=ai_project_os_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ai_project_os_registration:10m rate=1r/m;
limit_req_zone $binary_remote_addr zone=ai_project_os_graphic_captcha:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=ai_project_os_sms:10m rate=1r/m;
limit_req_zone $binary_remote_addr zone=ai_project_os_oauth_authorize:10m rate=3r/m;

server {
    listen 80;
    listen [::]:80;
    server_name ai-project-os.com www.ai-project-os.com;

    return 301 https://ai-project-os.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.ai-project-os.com;

    ssl_certificate /etc/nginx/ssl/ai-project-os.com/fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/ai-project-os.com/privkey.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    return 301 https://ai-project-os.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ai-project-os.com;

    ssl_certificate /etc/nginx/ssl/ai-project-os.com/fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/ai-project-os.com/privkey.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 56m;

    location = /api/auth/login {
        limit_req zone=ai_project_os_auth burst=5 nodelay;
        include /etc/nginx/snippets/ai-project-os-proxy.conf;
    }

    location = /api/auth/register {
        limit_req zone=ai_project_os_registration burst=1 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/ai-project-os-proxy.conf;
    }

    # Shared durable app budgets remain authoritative across IPs and replicas.
    location = /api/auth/sms/captcha {
        limit_req zone=ai_project_os_graphic_captcha burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 2k;
        include /etc/nginx/snippets/ai-project-os-proxy.conf;
    }

    location = /api/auth/sms/send {
        limit_req zone=ai_project_os_sms burst=1 nodelay;
        limit_req_status 429;
        client_max_body_size 2k;
        include /etc/nginx/snippets/ai-project-os-proxy.conf;
    }

    location = /api/admin/sms/test {
        limit_req zone=ai_project_os_sms burst=1 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;
        include /etc/nginx/snippets/ai-project-os-proxy.conf;
    }

    location = /api/auth/sms/login {
        limit_req zone=ai_project_os_auth burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 2k;
        include /etc/nginx/snippets/ai-project-os-proxy.conf;
    }

    location = /api/profile/close {
        limit_req zone=ai_project_os_auth burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 2k;
        include /etc/nginx/snippets/ai-project-os-proxy.conf;
    }

    location = /api/setup {
        limit_req zone=ai_project_os_auth burst=3 nodelay;
        include /etc/nginx/snippets/ai-project-os-proxy.conf;
    }

    location ~ ^/api/auth/oidc/start/ {
        limit_req zone=ai_project_os_auth burst=5 nodelay;
        include /etc/nginx/snippets/ai-project-os-proxy.conf;
    }

    location = /oauth/authorize {
        limit_req zone=ai_project_os_oauth_authorize burst=3 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/ai-project-os-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/ai-project-os-proxy.conf;
    }
}
