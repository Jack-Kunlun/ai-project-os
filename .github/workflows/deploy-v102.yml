name: Deploy v1.0.2

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ai-project-os-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy fixed v1.0.0 to v1.0.2 transition
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment:
      name: production
      url: https://ai-project-os.com
    env:
      PRODUCTION_SSH_HOST: ${{ vars.PRODUCTION_SSH_HOST }}
    steps:
      - name: Check out main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Require the exact source, target, migration delta, and full CI
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$GH_REPOSITORY" = Jack-Kunlun/ai-project-os
          test "$(node -p 'require("./package.json").version')" = 1.0.2

          target_tag=v1.0.2
          source_tag=v1.0.0
          source_sha=f57d050fffa445a6ef9eb3d7e692e6df06fac98d
          health=$(curl --fail --silent --show-error --connect-timeout 10 --max-time 20 https://ai-project-os.com/api/health)
          jq --exit-status '.version == "1.0.0" and .status == "ok" and .database == "up" and .worker.status == "up" and .worker.consecutiveFailures == 0' <<<"$health" >/dev/null

          git fetch --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/tags/$source_tag:refs/tags/$source_tag" \
            "refs/tags/$target_tag:refs/tags/$target_tag"
          test "$(git cat-file -t "refs/tags/$source_tag")" = tag
          test "$(git cat-file -t "refs/tags/$target_tag")" = tag
          test "$(git rev-parse "refs/tags/$source_tag^{}")" = "$source_sha"
          target_sha=$(git rev-parse "refs/tags/$target_tag^{}")
          test "$target_sha" = "$(git rev-parse HEAD)"
          test "$target_sha" = "$(git rev-parse refs/remotes/origin/main)"
          test "$target_sha" != "$source_sha"
          git merge-base --is-ancestor "$source_sha" "$target_sha"

          source_count=$(git ls-tree -d --name-only "$source_sha:prisma/migrations" | grep -Ec '^[0-9]{14}_')
          target_count=$(git ls-tree -d --name-only "$target_sha:prisma/migrations" | grep -Ec '^[0-9]{14}_')
          test "$source_count" = 143
          test "$target_count" = 145
          mapfile -t migration_delta < <(git diff --name-only "$source_sha" "$target_sha" -- prisma/migrations)
          expected_delta=(
            prisma/migrations/20261015010000_add_local_registration_entitlement_source/migration.sql
            prisma/migrations/20261015020000_bind_personal_semantic_token_reservations/migration.sql
          )
          [[ "${migration_delta[*]}" == "${expected_delta[*]}" ]]

          runs=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GH_REPOSITORY/actions/workflows/ci.yml/runs?event=push&status=success&head_sha=$target_sha&per_page=100")
          for branch in main "$target_tag"; do
            run_id=$(jq --exit-status --raw-output --arg sha "$target_sha" --arg branch "$branch" \
              '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == $branch and .event == "push" and .status == "completed" and .conclusion == "success")][0].id | numbers' <<<"$runs")
            jobs=$(curl --fail --silent --show-error \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GH_REPOSITORY/actions/runs/$run_id/jobs?per_page=100")
            jq --exit-status '.jobs | any(.name == "Verify database and release candidate" and .conclusion == "success")' <<<"$jobs" >/dev/null
          done
          printf 'DEPLOY_SOURCE_TAG=%s\nDEPLOY_TAG=%s\nDEPLOY_SOURCE_SHA=%s\nDEPLOY_SHA=%s\n' \
            "$source_tag" "$target_tag" "$source_sha" "$target_sha" >> "$GITHUB_ENV"

      - name: Prepare restricted production SSH identity
        env:
          PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$PRODUCTION_SSH_PRIVATE_KEY"
          test -n "$PRODUCTION_SSH_KNOWN_HOSTS"
          if [[ ! "$PRODUCTION_SSH_HOST" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo "PRODUCTION_SSH_HOST_INVALID" >&2
            exit 64
          fi
          install -d -m 700 "$RUNNER_TEMP/ai-project-os-ssh"
          printf '%s\n' "$PRODUCTION_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ai-project-os-ssh/id_ed25519"
          printf '%s\n' "$PRODUCTION_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/ai-project-os-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ai-project-os-ssh/id_ed25519" "$RUNNER_TEMP/ai-project-os-ssh/known_hosts"
          ssh-keygen -y -f "$RUNNER_TEMP/ai-project-os-ssh/id_ed25519" >/dev/null
          ssh-keygen -F "$PRODUCTION_SSH_HOST" -f "$RUNNER_TEMP/ai-project-os-ssh/known_hosts" >/dev/null

      - name: Verify the installed fixed tooling against target Git bytes
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/ai-project-os-ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ai-project-os-ssh/known_hosts" \
            -o ConnectTimeout=15 "ai-project-os-actions@$PRODUCTION_SSH_HOST" "v102-tooling-status" \
            > "$RUNNER_TEMP/v102-tooling.json"
          python3 - <<'PYCODE'
          import hashlib, json, os
          from pathlib import Path

          data = json.loads((Path(os.environ['RUNNER_TEMP']) / 'v102-tooling.json').read_text())
          expected = {
              'deployer': 'deploy/production/ai-project-os-v102-deploy.py',
              'backup': 'deploy/production/ai-project-os-backup',
              'artifact_helper': 'deploy/production/ai_project_os_backup_artifact.py',
              'sudoers': 'deploy/production/ai-project-os-deploy.sudoers',
              'gateway': 'deploy/production/ai-project-os-actions-gateway',
          }
          expected_files = {name: hashlib.sha256(Path(path).read_bytes()).hexdigest()
                            for name, path in expected.items()}
          assert data == {
              'kind': 'V102_TOOLING_READY', 'tag': 'v1.0.2',
              'revision': os.environ['DEPLOY_SHA'], 'files': expected_files,
          }, 'V102_TOOLING_STATE_INVALID'
          print('V102_TOOLING_VERIFIED')
          PYCODE

      - name: Deploy through the fixed source-to-target gateway
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/v102-deploy.log"
          ssh -i "$RUNNER_TEMP/ai-project-os-ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ai-project-os-ssh/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=20 -o ServerAliveCountMax=6 \
            "ai-project-os-actions@$PRODUCTION_SSH_HOST" \
            "deploy-v102 $DEPLOY_SHA CONFIRM_V102_WITH_BACKUP_AND_FULL_CI" | tee "$output"
          grep -E --line-regexp \
            "V102_DEPLOY_OK tag=v1\\.0\\.2 revision=$DEPLOY_SHA migration_count=145 backup=[0-9]{8}T[0-9]{6}Z-pre-deploy-to-v1\\.0\\.2\\.[A-Za-z0-9]{6} restore=143-to-145" \
            "$output"
          health=$(curl --fail --silent --show-error --connect-timeout 10 --max-time 20 https://ai-project-os.com/api/health)
          jq --exit-status \
            '.version == "1.0.2" and .status == "ok" and .database == "up" and .worker.status == "up" and .worker.consecutiveFailures == 0' \
            <<<"$health" >/dev/null
          printf 'Verified `%s` at `%s` with a 145-entry migration receipt and public health.\n' \
            "$DEPLOY_TAG" "$DEPLOY_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary SSH identity
        if: ${{ always() }}
        run: rm -f -- "$RUNNER_TEMP/ai-project-os-ssh/id_ed25519" "$RUNNER_TEMP/ai-project-os-ssh/known_hosts"
